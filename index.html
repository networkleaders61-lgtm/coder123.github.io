<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Tailor & Interview Coach</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif; background-color: #f3f4f6; color: #1f2937; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { font-size: 24px; text-align: center; color: #111827; margin-bottom: 24px; }
        label { font-weight: 600; display: block; margin-bottom: 8px; font-size: 14px; }
        textarea, input[type="file"] { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        textarea { height: 120px; resize: vertical; }
        button { width: 100%; background: #2563eb; color: white; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        .loading { display: none; text-align: center; font-weight: 600; color: #4b5563; margin: 20px 0; }
        .result-box { display: none; margin-top: 30px; border-top: 2px solid #e5e7eb; padding-top: 20px; }
        .score-circle { width: 80px; height: 80px; border-radius: 50%; background: #ef4444; color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin: 0 auto 20px; }
        .section-title { font-weight: bold; color: #1f2937; margin-top: 20px; border-left: 4px solid #2563eb; padding-left: 8px; }
        ul { padding-left: 20px; line-height: 1.6; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>💼 AI Resume & Interview Coach</h1>
    
    <label for="jobDesc">1. Paste Job Description</label>
    <textarea id="jobDesc" placeholder="Paste the job description or core requirements here..."></textarea>

    <label for="resumeFile">2. Upload Resume (PDF Only)</label>
    <input type="file" id="resumeFile" accept=".pdf">

    <button onclick="processResume()">Tailor My Resume & Get Coach Questions</button>
    
    <div id="loading" class="loading">⏳ Processing with AI... (Takes around 10-15 seconds)</div>

    <div id="result" class="result-box">
        <div id="score" class="score-circle">0%</div>
        
        <div class="section-title">❌ Missing Keywords & Skills</div>
        <ul id="missingSkills"></ul>

        <div class="section-title">✨ Optimized Resume Bullet Points</div>
        <ul id="improvedBullets"></ul>

        <div class="section-title">🎙️ Target Mock Interview Questions</div>
        <ul id="interviewQuestions"></ul>
    </div>
</div>

<script>
    async function processResume() {
        const fileInput = document.getElementById('resumeFile');
        const jobDesc = document.getElementById('jobDesc').value;
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');

        if (!fileInput.files[0] || !jobDesc.trim()) {
            alert('Please select a file and paste a job description first!');
            return;
        }

        loading.style.display = 'block';
        result.style.display = 'none';

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('job_description', jobDesc);

        try {
            const response = await fetch('http://localhost:8000/api/tailor', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('API Request Failed');
            
            const data = await response.json();
            
            // Render results dynamically
            const scoreElement = document.getElementById('score');
            scoreElement.innerText = data.match_percentage + '%';
            
            // Set score ring colors based on match ranking
            if(data.match_percentage >= 80) scoreElement.style.background = '#10b981';
            else if(data.match_percentage >= 50) scoreElement.style.background = '#f59e0b';
            else scoreElement.style.background = '#ef4444';

            document.getElementById('missingSkills').innerHTML = data.missing_skills.map(s => `<li>${s}</li>`).join('');
            document.getElementById('improvedBullets').innerHTML = data.improved_bullet_points.map(b => `<li>${b}</li>`).join('');
            document.getElementById('interviewQuestions').innerHTML = data.mock_interview_questions.map(q => `<li><strong>${q}</strong></li>`).join('');

            loading.style.display = 'none';
            result.style.display = 'block';
            
            if (data.match_percentage >= 75) confetti();

        } catch (error) {
            alert('Error running AI parser: ' + error.message);
            loading.style.display = 'none';
        }
    }
</script>

</body>
</html>
